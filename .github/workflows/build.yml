name: Build visionOS client

# Compile check only: no signing, no device. Builds the Rust client core, repacks it
# as an xcframework (same steps as build_and_repack.sh) and builds the app with the
# visionOS SDK.

on:
  push:
    branches-ignore: ['probe/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 27 (visionOS 27 SDK)
            runner: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i xros || true
          rustc --version
          cargo --version

      - name: Rust target and cbindgen
        run: |
          rustup target add aarch64-apple-ios
          brew install cbindgen

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ALVR/target
          key: cargo-${{ runner.os }}-${{ hashFiles('ALVR/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build client core and xcframework
        run: |
          unset SDKROOT
          rm -rf ALVR/build ALVR/alvr/server
          CARGO_TARGET_DIR=ALVR/target cargo build --manifest-path ALVR/Cargo.toml \
            --target=aarch64-apple-ios -p alvr_client_core --profile distribution
          mkdir -p ALVR/build
          (cd ALVR/alvr/client_core && cbindgen --config cbindgen.toml --crate alvr_client_core --output ../../build/alvr_client_core.h)
          sh repack_alvr_client.sh

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project ALVRClient.xcodeproj -scheme ALVRClient -configuration Debug \
            -destination 'generic/platform=visionOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned .ipa
        run: |
          APP=build/Build/Products/Debug-xros/ALVRClient.app
          test -d "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ALVRClient-unsigned.ipa Payload)
          ls -l ALVRClient-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ALVRClient-unsigned-ipa
          path: ALVRClient-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-${{ matrix.runner }}
          path: xcodebuild.log
          if-no-files-found: ignore
