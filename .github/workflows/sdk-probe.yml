name: SDK probe
on:
  push:
    branches: ['probe/**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Dump API surface 2
        run: |
          SDK=$(xcrun --sdk xros --show-sdk-path)
          F="$SDK/System/Library/Frameworks/GameController.framework"
          I=$(find "$F" -name 'arm64e-apple-xros.swiftinterface' | head -1)
          echo "=== HomeButtonSettingsManager swift"; sed -n 205,240p "$I"
          echo "=== GCSpatialAccessory.h"; cat "$F/Headers/GCSpatialAccessory.h"
          echo "=== ARKit accessory interface files"
          grep -rl "AccessoryTrackingProvider" "$SDK/System/Library/Frameworks" 2>/dev/null | head
          for f in $(grep -rl "AccessoryTrackingProvider" "$SDK/System/Library/Frameworks" --include='arm64e-apple-xros.swiftinterface' | head -2); do
            echo "--- $f"; grep -n -i -E "AccessoryTrackingProvider|predictAnchor|AccessoryAnchor|updateAccessories|highFrame|public var timestamp|anchorUpdates" "$f" | head -60
          done
